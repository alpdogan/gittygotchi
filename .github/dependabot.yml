version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      biome:
        patterns:
          - "@biomejs/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      wrangler:
        patterns:
          - wrangler
          - "@cloudflare/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
