name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    # Dependency Review uses GitHub's Dependency Review API. That API is
    # included for public repositories, but on private repositories it requires
    # GitHub Code Security / Advanced Security. This repository is private and
    # we do not require paid GHAS, so skip unless the repo is public. pnpm audit
    # remains the supply-chain check for this workflow.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

  codeql:
    # Code scanning result upload requires GitHub Code Security on private
    # repositories. Skip on private repos so Security CI does not fail for an
    # unavailable paid feature; the job still runs if the repository is public.
    if: ${{ !github.event.repository.private }}
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
