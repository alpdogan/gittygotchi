<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="fire" data-prototype-stage="adult" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="adult"><title>Fire Gitty adult happy prototype</title><desc>adult happy fire Gitty visual prototype with stage-aware class treatment.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-fire .gitty-tail { animation: fire-tail-idle 2.2s ease-in-out infinite; } .fire-flame, .fire-tail-flame { animation: fire-flicker 1.35s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .flame-2 { animation-duration: 1.08s; animation-delay: -.54s; } .flame-3 { animation-duration: 1.62s; animation-delay: -.91s; } .flame-4 { animation-duration: 1.48s; animation-delay: -.72s; } .fire-tail-flame { animation-duration: 1.8s; animation-delay: -.35s; } .fire-tail-glow { animation: fire-flicker 1.12s ease-in-out infinite; } .fire-ember { animation: fire-ember 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; } .ember-2 { animation-duration: 4.1s; animation-delay: -2.3s; } .ember-3 { animation-duration: 2.7s; animation-delay: -1.1s; } .ember-4 { animation-duration: 3.8s; animation-delay: -3s; } .ember-5 { animation-duration: 3.5s; animation-delay: -2.6s; } .ember-6 { animation-duration: 4.3s; animation-delay: -1.8s; } @keyframes fire-flicker { 0%, 100% { opacity: .82; transform: translateY(1px) scale(.94, .9) rotate(-2deg); } 50% { opacity: 1; transform: translateY(-2px) scale(1.04, 1.12) rotate(2deg); } } @keyframes fire-ember { 0% { opacity: 0; transform: translate(0, 8px) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(5px, -20px) scale(.25); } } @keyframes fire-tail-idle { 0%, 100% { transform: rotate(-2deg); } 45% { transform: rotate(4deg); } 70% { transform: rotate(1deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-fire behavior-idle"><g data-effect-tier="adult"><g stroke="#2b2632" stroke-width="2" stroke-linejoin="round"><path class="fire-flame flame-1" data-effect-element="flame" d="M43 178 C31 164 41 151 52 142 C49 154 61 158 57 171 C55 180 49 184 43 178Z" fill="#ef6437"/><path class="fire-flame flame-2" data-effect-element="flame" d="M199 169 C187 155 197 141 208 132 C205 145 217 149 213 162 C211 171 205 175 199 169Z" fill="#ef6437"/><path class="fire-flame flame-3" data-effect-element="flame" d="M188 81 C180 70 187 60 196 53 C193 64 203 67 199 77 C197 83 192 86 188 81Z" fill="#f5ad4e"/></g></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-adult" data-anatomy-stage="adult"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M94 178 C62 197 29 179 27 145 C25 112 48 82 76 82 C101 82 116 101 108 121 C102 138 84 148 69 140 C56 134 54 119 62 109 C68 102 79 101 86 107 C77 106 70 112 70 120 C70 128 80 132 88 126 C101 116 96 97 79 94 C59 91 42 112 43 137 C44 159 62 173 84 167 C88 166 92 170 94 178Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path class="fire-tail-flame" d="M89 171 C68 185 45 173 38 154 C32 137 37 117 52 103 C49 119 63 125 61 140 C60 153 69 163 89 171Z" fill="#ef6437" stroke="#2b2632" stroke-width="2.5" stroke-linejoin="round"/><path class="fire-tail-flame" d="M76 166 C61 159 55 148 58 137 C61 145 70 148 73 156 C74 160 75 163 76 166Z" fill="#f5ad4e"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M118 130 C102 136 94 151 94 173 C94 195 106 207 124 209 C142 211 164 207 171 190 C179 171 168 142 151 132 C141 126 128 126 118 130Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 151 161 C140 166 125 164 110 158 C106 163 107 169 110 174Z" fill="#f5ad4e" opacity=".72"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M119 158 C126 148 132 151 134 160 C139 154 147 158 146 168 C139 175 127 175 119 168Z" fill="#ef6437"/><path d="M128 160 C132 156 136 160 135 166" fill="none" stroke="#f5ad4e" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M101 86 C82 84 62 77 51 88 C45 95 48 105 56 109 C66 114 83 105 99 96 C105 92 106 87 101 86Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M135 81 C136 62 141 44 151 36 C158 43 160 55 157 69 L166 61 C167 75 159 87 147 94 C139 98 134 91 135 81Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M95 89 C79 87 64 84 57 92 C68 101 82 97 96 92Z" fill="#ef6437"/><path d="M143 78 C144 62 148 50 152 45 C159 56 155 71 149 84Z" fill="#ef6437"/><path d="M148 76 C149 67 152 59 154 55" fill="none" stroke="#f5ad4e" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M108 78 C94 80 84 90 82 104 C80 111 83 117 77 123 L86 126 L80 136 C89 136 94 143 105 147 C123 154 149 148 158 132 C165 119 161 97 148 87 C138 79 121 75 108 78Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M129 82 C139 91 136 101 128 103 C119 99 121 90 129 82Z" fill="#ef6437"/><path d="M129 89 C133 94 131 98 128 99 C125 97 126 93 129 89Z" fill="#f5ad4e"/></g><g><g class=