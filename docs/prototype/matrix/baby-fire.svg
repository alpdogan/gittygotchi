<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="fire" data-prototype-stage="baby" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="none"><title>Fire Gitty baby happy prototype</title><desc>baby happy fire Gitty visual prototype with stage-aware class treatment.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-fire .gitty-tail { animation: fire-tail-idle 2.2s ease-in-out infinite; } .fire-flame, .fire-tail-flame { animation: fire-flicker 1.35s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .flame-2 { animation-duration: 1.08s; animation-delay: -.54s; } .flame-3 { animation-duration: 1.62s; animation-delay: -.91s; } .flame-4 { animation-duration: 1.48s; animation-delay: -.72s; } .fire-tail-flame { animation-duration: 1.8s; animation-delay: -.35s; } .fire-tail-glow { animation: fire-flicker 1.12s ease-in-out infinite; } .fire-ember { animation: fire-ember 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; } .ember-2 { animation-duration: 4.1s; animation-delay: -2.3s; } .ember-3 { animation-duration: 2.7s; animation-delay: -1.1s; } .ember-4 { animation-duration: 3.8s; animation-delay: -3s; } .ember-5 { animation-duration: 3.5s; animation-delay: -2.6s; } .ember-6 { animation-duration: 4.3s; animation-delay: -1.8s; } @keyframes fire-flicker { 0%, 100% { opacity: .82; transform: translateY(1px) scale(.94, .9) rotate(-2deg); } 50% { opacity: 1; transform: translateY(-2px) scale(1.04, 1.12) rotate(2deg); } } @keyframes fire-ember { 0% { opacity: 0; transform: translate(0, 8px) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(5px, -20px) scale(.25); } } @keyframes fire-tail-idle { 0%, 100% { transform: rotate(-2deg); } 45% { transform: rotate(4deg); } 70% { transform: rotate(1deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-fire behavior-idle"><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-baby" data-anatomy-stage="baby"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M102 180 C78 192 59 178 59 157 C59 139 74 128 88 134 C101 140 101 155 92 161 C84 166 76 161 78 153 C79 148 84 146 89 149" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path class="fire-tail-flame" d="M89 171 C68 185 45 173 38 154 C32 137 37 117 52 103 C49 119 63 125 61 140 C60 153 69 163 89 171Z" fill="#ef6437" stroke="#2b2632" stroke-width="2.5" stroke-linejoin="round"/><path class="fire-tail-flame" d="M76 166 C61 159 55 148 58 137 C61 145 70 148 73 156 C74 160 75 163 76 166Z" fill="#f5ad4e"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M108 137 C95 148 94 177 103 195 C112 211 146 212 159 197 C171 181 164 149 151 138 C140 128 119 128 108 137Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 151 161 C140 166 125 164 110 158 C106 163 107 169 110 174Z" fill="#f5ad4e" opacity=".72"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path d="M119 158 C126 148 132 151 134 160 C139 154 147 158 146 168 C139 175 127 175 119 168Z" fill="#ef6437"/><path d="M128 160 C132 156 136 160 135 166" fill="none" stroke="#f5ad4e" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M103 88 C82 75 55 69 46 83 C39 95 53 108 72 106 C84 104 96 97 103 88Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M136 78 C136 55 145 35 155 29 C166 43 164 65 150 86Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path d="M95 89 C79 87 64 84 57 92 C68 101 82 97 96 92Z" fill="#ef6437"/><path d="M143 78 C144 62 148 50 152 45 C159 56 155 71 149 84Z" fill="#ef6437"/><path d="M148 76 C149 67 152 59 154 55" fill="none" stroke="#f5ad4e" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M98 77 C84 89 82 115 91 134 C101 154 143 157 158 137 C170 121 166 94 151 80 C138 68 112 67 98 77Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path d="M129 82 C139 91 136 101 128 103 C119 99 121 90 129 82Z" fill="#ef6437"/><path d="M129 89 C133 94 131 98 128 99 C125 97 126 93 129 89Z" fill="#f5ad4e"/></g><g transform="translate(126 112) scale(1.08) translate(-126 -112)"><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#2b2632"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#2b2632"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#2b2632" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#2b2632" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M102 191 C94 196 97 207 108 209 C118 210 124 201 117 195Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M145 192 C137 198 141 208 152 209 C162 208 166 199 158 194Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 202 L106 198 M111 204 L113 200 M148 203 L151 199 M156 204 L158 200" stroke="#2b2632" stroke-width="1.8" stroke-linecap="round"/></g></g></g></g></svg>
