<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="air" data-prototype-stage="mature" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="mature"><title>Air Gitty mature happy prototype</title><desc>mature happy air Gitty visual prototype with stage-aware class treatment.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-air .gitty-character { animation: air-hover 2.9s ease-in-out infinite; } .air-wind { animation: air-wind 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .wind-2 { animation-duration: 5.3s; animation-delay: -2.8s; } .wind-3 { animation-duration: 4.9s; animation-delay: -1.9s; } .air-spark { animation: air-spark 6.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .spark-2 { animation-duration: 7.4s; animation-delay: -3.6s; } .spark-3 { animation-duration: 8.1s; animation-delay: -5.2s; } @keyframes air-wind { 0%, 12% { opacity: 0; transform: translateX(-16px); } 28%, 62% { opacity: .9; } 82%, 100% { opacity: 0; transform: translateX(24px); } } @keyframes air-spark { 0%, 67%, 74%, 81%, 100% { opacity: 0; transform: scale(.55) rotate(-8deg); } 70%, 78% { opacity: 1; transform: scale(1.08) rotate(3deg); } } @keyframes air-hover { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(.7deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-air behavior-idle"><g data-effect-tier="adult"><g class="air-wind wind-1" data-effect-element="wind" fill="none" stroke="#63b9d6" stroke-width="3" stroke-linecap="round"><path d="M28 104 C43 96 56 99 66 106"/><path d="M35 114 C46 110 55 112 60 117"/></g><g class="air-wind wind-2" data-effect-element="wind" fill="none" stroke="#63b9d6" stroke-width="3" stroke-linecap="round"><path d="M174 167 C190 158 205 160 216 168"/><path d="M182 178 C193 172 205 174 212 180"/></g></g><g data-effect-tier="mature"><g class="air-wind wind-3" data-effect-element="wind" fill="none" stroke="#b8e4eb" stroke-width="3" stroke-linecap="round"><path d="M151 52 C170 42 190 45 204 55"/><path d="M161 63 C177 56 192 59 201 66"/></g></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-mature" data-anatomy-stage="mature"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M101 183 C69 204 29 188 24 151 C19 114 46 78 79 79 C107 80 123 102 113 125 C104 146 78 152 61 138 C48 128 48 109 61 99 C73 90 91 95 95 108 C99 120 90 132 79 131 C71 130 66 123 69 116 C71 111 77 109 82 112" fill="none" stroke="#17283b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M101 183 C69 204 29 188 24 151 C19 114 46 78 79 79 C107 80 123 102 113 125 C104 146 78 152 61 138 C48 128 48 109 61 99 C73 90 91 95 95 108 C99 120 90 132 79 131 C71 130 66 123 69 116 C71 111 77 109 82 112" fill="none" stroke="#f2f2ea" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-mature" opacity="1" transform="translate(128 136) scale(1.13) translate(-128 -136)"><path d="M88 171 C62 185 39 168 36 145 C34 126 43 108 58 98" fill="none" stroke="#63b9d6" stroke-width="7" stroke-linecap="round"/><path d="M50 144 C61 138 70 141 78 147 M47 154 C59 150 68 152 73 157" fill="none" stroke="#b8e4eb" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-wings" data-anatomy-feature="mature-wings"><path data-anatomy-part="left-wing" d="M109 137 C91 126 70 126 59 137 C72 139 77 145 72 154 C86 153 98 159 107 169 C112 158 114 146 109 137Z" fill="#f2f2ea" stroke="#17283b" stroke-width="