 136) scale(1.13) translate(-128 -136)"><path d="M95 89 C79 87 64 84 57 92 L73 95 L64 101 C75 103 87 97 96 92Z" fill="#63b9d6"/><path d="M143 78 C144 62 148 50 152 45 L154 61 L160 55 C160 68 154 79 149 84Z" fill="#63b9d6"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M107 70 C91 76 82 91 83 108 L76 120 L88 124 L78 136 L94 137 L89 145 C103 145 110 153 126 154 C148 155 166 143 171 124 C176 106 167 85 151 76 C139 69 120 66 107 70Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-mature" opacity="1" transform="translate(128 136) scale(1.13) translate(-128 -136)"><g class="mature-forehead-echo" transform="translate(129 93) scale(1.16) translate(-129 -93)" opacity=".3"><path d="M129 83 L135 93 L129 101 L124 93Z" fill="#63b9d6"/><path d="M129 87 L130 96" stroke="#b8e4eb" stroke-width="2" stroke-linecap="round"/></g><path d="M129 83 L135 93 L129 101 L124 93Z" fill="#63b9d6"/><path d="M129 87 L130 96" stroke="#b8e4eb" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(131 111) scale(1.02) translate(-128 -114)"><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#17283b"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#17283b"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#17283b" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#17283b" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M97 196 C87 202 88 214 100 218 C112 221 124 216 124 207 C123 200 107 192 97 196Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M147 197 C138 202 140