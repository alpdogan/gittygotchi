 stroke-linecap="round"/></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M103 84 C78 80 49 64 34 76 C23 85 28 101 42 109 C58 117 82 102 103 92 C111 88 111 85 103 84Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M135 78 C134 51 142 25 155 13 C168 25 170 47 162 68 L177 51 C181 73 165 94 147 101 C137 105 134 92 135 78Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-mature" opacity="1" transform="translate(128 136) scale(1.13) translate(-128 -136)"><path d="M95 89 C79 87 64 84 57 92 C67 101 81 97 96 92Z" fill="#3697dc"/><path d="M143 78 C144 62 148 50 152 45 C158 56 154 71 149 83Z" fill="#3697dc"/><path d="M145 75 C147 65 150 58 153 54" fill="none" stroke="#8bd8e8" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M107 70 C91 76 82 91 83 108 L76 120 L88 124 L78 136 L94 137 L89 145 C103 145 110 153 126 154 C148 155 166 143 171 124 C176 106 167 85 151 76 C139 69 120 66 107 70Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-mature" opacity="1" transform="translate(128 136) scale(1.13) translate(-128 -136)"><g class="mature-forehead-echo" transform="translate(129 93) scale(1.16) translate(-129 -93)" opacity=".3"><path d="M129 84 L136 93 L129 101 L122 93Z" fill="#3697dc"/><path d="M129 87 L132 93 L129 96Z" fill="#8bd8e8"/></g><path d="M129 84 L136 93 L129 101 L122 93Z" fill="#3697dc"/><path d="M129 87 L132 93 L129 96Z" fill="#8bd8e8"/></g><g transform="translate(131 111) scale(1.02) translate(-128 -114)"><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#17283b"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#17283b"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#17283b" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#17283b" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M97 196 C87 202 88 214 100 218 C112 221 124 216 124 207 C123 200 107 192 97 196Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M147 197 C138 202 140 215 152 218 C165 221 177 215 175 207 C173 199 157 193 147 197Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 211 L102 205 M108 214 L111 208 M151 213 L154 207 M163 214 L166 208" stroke="#17283b" stroke-width="1.8" stroke-linecap="round"/></g></g></g><g data-effect-tier="adult"><path class="water-drop drop-1" data-effect-element="drop" d="M46 82 C54 92 52 101 46 104 C39 101 38 92 46 82Z" fill="#8bd8e8" stroke="#3697dc" stroke-width="2"/><path class="water-drop drop-2" data-effect-element="drop" d="M207 103 C214 112 212 119 207 122 C201 119 201 111 207 103Z" fill="#8bd8e8" stroke="#3697dc" stroke-width="2"/></g><g data-effect-tier="mature"><path class="water-drop drop-3" data-effect-element="drop" d="M88 45 C95 54 93 62 88 65 C82 62 82 54 88 45Z" fill="#8bd8e8" stroke="#3697dc" stroke-width="2"/></g></g></svg>
