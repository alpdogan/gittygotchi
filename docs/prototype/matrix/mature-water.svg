<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="water" data-prototype-stage="mature" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="mature"><title>Water Gitty mature happy prototype</title><desc>mature happy water Gitty visual prototype with stage-aware class treatment.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-water .gitty-tail { animation: water-tail-flow 3.3s ease-in-out infinite; } .water-bubble { animation: water-bubble-rise 4.8s ease-in infinite; transform-box: fill-box; transform-origin: center; } .bubble-2 { animation-duration: 5.7s; animation-delay: -2.3s; } .bubble-3 { animation-duration: 6.4s; animation-delay: -4.8s; } .bubble-4 { animation-duration: 4.2s; animation-delay: -1.4s; } .bubble-5 { animation-duration: 5.2s; animation-delay: -3.5s; } .bubble-6 { animation-duration: 5.9s; animation-delay: -4.1s; } .bubble-7 { animation-duration: 4.5s; animation-delay: -2.8s; } .water-drop { animation: water-drop-bob 3.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .drop-2 { animation-duration: 4.6s; animation-delay: -2.2s; } .drop-3 { animation-duration: 4.1s; animation-delay: -1.6s; } @keyframes water-bubble-rise { 0% { opacity: 0; transform: translate(0, 24px) scale(.7); } 18% { opacity: .85; } 80% { opacity: .65; } 100% { opacity: 0; transform: translate(8px, -42px) scale(1.06); } } @keyframes water-drop-bob { 0%, 100% { opacity: .45; transform: translateY(3px); } 50% { opacity: 1; transform: translateY(-5px); } } @keyframes water-tail-flow { 0%, 100% { transform: rotate(-1deg) scaleX(1); } 50% { transform: rotate(3deg) scaleX(1.025); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-water behavior-idle"><g data-effect-tier="adult"><g fill="none" stroke="#3697dc" stroke-width="2.5"><circle class="water-bubble bubble-1" data-effect-element="bubble" cx="44" cy="184" r="7"/><circle class="water-bubble bubble-2" data-effect-element="bubble" cx="62" cy="151" r="4"/><circle class="water-bubble bubble-3" data-effect-element="bubble" cx="193" cy="191" r="9"/><circle class="water-bubble bubble-4" data-effect-element="bubble" cx="205" cy="148" r="5"/><circle class="water-bubble bubble-5" data-effect-element="bubble" cx="181" cy="94" r="3.5"/></g></g><g data-effect-tier="mature"><g fill="none" stroke="#8bd8e8" stroke-width="2.5"><circle class="water-bubble bubble-6" data-effect-element="bubble" cx="28" cy="133" r="5"/><circle class="water-bubble bubble-7" data-effect-element="bubble" cx="218" cy="177" r="4"/></g><path class="water-wave" data-effect-element="wave" d="M30 207 C47 197 62 217 79 207" fill="none" stroke="#3697dc" stroke-width="3" stroke-linecap="round"/></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-mature" data-anatomy-stage="mature"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M101 183 C69 204 29 188 24 151 C19 114 46 78 79 79 C107 80 123 102 113 125 C104 146 78 152 61 138 C48 128 48 109 61 99 C73 90 91 95 95 108 C99 120 90 132 79 131 C71 130 66 123 69 116 C71 111 77 109 82 112" fill="none" stroke="#17283b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M101 183 C69 204 29 188 24 151 C19 114 46 78 79 79 C107 80 123 102 113 125 C104 146 78 152 61 138 C48 128 48 109 61 99 C73 90 91 95 95 108 C99 120 90 132 79 131 C71 130 66 123 69 116 C71 111 77 109 82 112" fill="none" stroke="#f0f2e9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-mature" opacity="1" transform="tra