<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="air" data-prototype-stage="adult" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="adult"><title>Air Gitty adult happy prototype</title><desc>adult happy air Gitty visual prototype with stage-aware class treatment.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-air .gitty-character { animation: air-hover 2.9s ease-in-out infinite; } .air-wind { animation: air-wind 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .wind-2 { animation-duration: 5.3s; animation-delay: -2.8s; } .wind-3 { animation-duration: 4.9s; animation-delay: -1.9s; } .air-spark { animation: air-spark 6.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .spark-2 { animation-duration: 7.4s; animation-delay: -3.6s; } .spark-3 { animation-duration: 8.1s; animation-delay: -5.2s; } @keyframes air-wind { 0%, 12% { opacity: 0; transform: translateX(-16px); } 28%, 62% { opacity: .9; } 82%, 100% { opacity: 0; transform: translateX(24px); } } @keyframes air-spark { 0%, 67%, 74%, 81%, 100% { opacity: 0; transform: scale(.55) rotate(-8deg); } 70%, 78% { opacity: 1; transform: scale(1.08) rotate(3deg); } } @keyframes air-hover { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(.7deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-air behavior-idle"><g data-effect-tier="adult"><g class="air-wind wind-1" data-effect-element="wind" fill="none" stroke="#63b9d6" stroke-width="3" stroke-linecap="round"><path d="M28 104 C43 96 56 99 66 106"/><path d="M35 114 C46 110 55 112 60 117"/></g><g class="air-wind wind-2" data-effect-element="wind" fill="none" stroke="#63b9d6" stroke-width="3" stroke-linecap="round"><path d="M174 167 C190 158 205 160 216 168"/><path d="M182 178 C193 172 205 174 212 180"/></g></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-adult" data-anatomy-stage="adult"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M94 178 C62 197 29 179 27 145 C25 112 48 82 76 82 C101 82 116 101 108 121 C102 138 84 148 69 140 C56 134 54 119 62 109 C68 102 79 101 86 107 C77 106 70 112 70 120 C70 128 80 132 88 126 C101 116 96 97 79 94 C59 91 42 112 43 137 C44 159 62 173 84 167 C88 166 92 170 94 178Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M88 171 C62 185 39 168 36 145 C34 126 43 108 58 98" fill="none" stroke="#63b9d6" stroke-width="7" stroke-linecap="round"/><path d="M50 144 C61 138 70 141 78 147 M47 154 C59 150 68 152 73 157" fill="none" stroke="#b8e4eb" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M118 130 C102 136 94 151 94 173 C94 195 106 207 124 209 C142 211 164 207 171 190 C179 171 168 142 151 132 C141 126 128 126 118 130Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 151 161 C140 166 125 164 110 158 C106 163 107 169 110 174Z" fill="#b8e4eb" opacity=".72"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M111 158 L129 151 L121 164 L143 158 L131 174 L151 169" fill="none" stroke="#63b9d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M101 86 C82 84 62 77 51 88 C45 95 48 105 56 109 C66 114 83 105 99 96 C105 92 106 87 101 86Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M135 81 C136 62 141 44 151 36 C158 43 160 55 157 69 L166 61 C167 75 159 87 147 94 C139 98 134 91 135 81Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M95 89 C79 87 64 84 57 92 L73 95 L64 101 C75 103 87 97 96 92Z" fill="#63b9d6"/><path d="M143 78 C144 62 148 50 152 45 L154 61 L160 55 C160 68 154 79 149 84Z" fill="#63b9d6"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M108 78 C94 80 84 90 82 104 C80 111 83 117 77 123 L86 126 L80 136 C89 136 94 143 105 147 C123 154 149 148 158 132 C165 119 161 97 148 87 C138 79 121 75 108 78Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M129 83 L135 93 L129 101 L124 93Z" fill="#63b9d6"/><path d="M129 87 L130 96" stroke="#b8e4eb" stroke-width="2" stroke-linecap="round"/></g><g><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#17283b"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#17283b"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#17283b" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#17283b" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M101 192 C94 195 94 205 103 208 C111 210 119 207 119 201 C118 195 108 190 101 192Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M143 194 C137 198 139 207 148 209 C157 211 164 207 163 201 C161 195 150 191 143 194Z" fill="#f2f2ea" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 202 L106 198 M111 204 L113 200 M148 203 L151 199 M156 204 L158 200" stroke="#17283b" stroke-width="1.8" stroke-linecap="round"/></g></g></g><g data-effect-tier="adult"><path class="air-spark spark-1" data-effect-element="spark" d="M190 78 L184 91 L193 89 L188 105 L205 84 L196 86 L201 78Z" fill="#f0b83e" stroke="#17283b" stroke-width="1.8" stroke-linejoin="round"/><path class="air-spark spark-2" data-effect-element="spark" d="M54 160 L49 170 L57 168 L52 181 L66 164 L59 166 L62 160Z" fill="#f0b83e" stroke="#17283b" stroke-width="1.6" stroke-linejoin="round"/></g></g></svg>
