<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="earth" data-prototype-stage="adult" data-prototype-mood="neutral" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="neutral" data-class-effect-level="adult"><title>Earth Gitty adult neutral prototype</title><desc>adult neutral earth Gitty visual prototype with stage-aware class treatment.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-earth .gitty-tail { animation-duration: 5.8s; } .earth-leaf { animation: earth-leaf-drift 6.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .leaf-2 { animation-duration: 7.8s; animation-delay: -2.1s; opacity: .76; } .leaf-3 { animation-duration: 5.9s; animation-delay: -4.2s; opacity: .88; } .leaf-4 { animation-duration: 8.6s; animation-delay: -1.3s; opacity: .68; } .leaf-5 { animation-duration: 7.1s; animation-delay: -5.4s; opacity: .82; } .leaf-6 { animation-duration: 9.2s; animation-delay: -3.2s; opacity: .72; } .leaf-7 { animation-duration: 7.5s; animation-delay: -1.7s; } .leaf-8 { animation-duration: 6.7s; animation-delay: -4.8s; } .leaf-9 { animation-duration: 8.2s; animation-delay: -2.6s; } @keyframes earth-leaf-drift { 0%, 100% { transform: translate(0, -4px) rotate(-8deg); } 50% { transform: translate(8px, 10px) rotate(24deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-earth behavior-idle"><g data-effect-tier="adult"><g fill="#5f8f4a"><path class="earth-leaf leaf-1" data-effect-element="leaf" d="M38 78 C49 74 55 80 51 90 C42 91 36 86 38 78Z"/><path class="earth-leaf leaf-2" data-effect-element="leaf" d="M190 68 C201 64 207 71 202 81 C194 81 188 76 190 68Z"/><path class="earth-leaf leaf-3" data-effect-element="leaf" d="M205 137 C216 134 221 142 215 151 C207 150 202 145 205 137Z"/><path class="earth-leaf leaf-4" data-effect-element="leaf" d="M49 188 C59 183 66 190 61 199 C53 199 47 195 49 188Z"/><path class="earth-leaf leaf-5" data-effect-element="leaf" d="M178 208 C188 203 194 210 190 219 C181 219 176 215 178 208Z"/></g></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-adult" data-anatomy-stage="adult"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M94 178 C62 197 29 179 27 145 C25 112 48 82 76 82 C101 82 116 101 108 121 C102 138 84 148 69 140 C56 134 54 119 62 109 C68 102 79 101 86 107 C77 106 70 112 70 120 C70 128 80 132 88 126 C101 116 96 97 79 94 C59 91 42 112 43 137 C44 159 62 173 84 167 C88 166 92 170 94 178Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M88 171 C60 184 38 166 36 142 C34 119 50 96 71 91" fill="none" stroke="#5f8f4a" stroke-width="7" stroke-linecap="round"/><path d="M45 132 C55 128 63 132 65 141 C56 145 48 141 45 132Z" fill="#79a85d"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M118 130 C102 136 94 151 94 173 C94 195 106 207 124 209 C142 211 164 207 171 190 C179 171 168 142 151 132 C141 126 128 126 118 130Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 151 161 C140 166 125 164 110 158 C106 163 107 169 110 174Z" fill="#c9d9ac" opacity=".72"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M118 157 C127 151 136 154 137 163 C129 169 120 166 118 157Z" fill="#5f8f4a" opacity=".85"/><path d="M143 179 C151 174 158 179 155 187 C148 188 143 185 143 179Z" fill="#5f8f4a" opacity=".65"/></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M101 86 C82 84 62 77 51 88 C45 95 48 105 56 109 C66 114 83 105 99 96 C105 92 106 87 101 86Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M135 81 C136 62 141 44 151 36 C158 43 160 55 157 69 L166 61 C167 75 159 87 147 94 C139 98 134 91 135 81Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M95 89 C79 88 63 84 57 92 C65 100 80 98 96 92Z" fill="#5f8f4a"/><path d="M143 78 C144 63 148 51 151 47 C156 55 154 69 149 82Z" fill="#5f8f4a"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M108 78 C94 80 84 90 82 104 C80 111 83 117 77 123 L86 126 L80 136 C89 136 94 143 105 147 C123 154 149 148 158 132 C165 119 161 97 148 87 C138 79 121 75 108 78Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M122 91 C126 84 134 84 138 91 C133 99 127 99 122 91Z" fill="#5f8f4a"/></g><g><g class="gitty-face face-neutral"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="6.5" ry="9.5" fill="#17283b"/><ellipse cx="140" cy="109" rx="6" ry="9" fill="#17283b"/><circle cx="106" cy="109" r="2" fill="#fffdf8"/><circle cx="138" cy="106" r="1.8" fill="#fffdf8"/></g><path d="M120 130 C127 133 135 132 140 127" fill="none" stroke="#17283b" stroke-width="3" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M101 192 C94 195 94 205 103 208 C111 210 119 207 119 201 C118 195 108 190 101 192Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M143 194 C137 198 139 207 148 209 C157 211 164 207 163 201 C161 195 150 191 143 194Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 202 L106 198 M111 204 L113 200 M148 203 L151 199 M156 204 L158 200" stroke="#17283b" stroke-width="1.8" stroke-linecap="round"/></g></g></g><g data-effect-tier="adult"><path class="earth-leaf leaf-6" data-effect-element="leaf" d="M73 57 C83 52 90 59 85 69 C77 69 71 65 73 57Z" fill="#79a85d"/></g></g></svg>
