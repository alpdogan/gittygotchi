<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="earth" data-prototype-stage="young" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="none"><title>Earth Gitty young happy prototype</title><desc>young happy earth Gitty visual prototype with stage-aware class treatment.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-earth .gitty-tail { animation-duration: 5.8s; } .earth-leaf { animation: earth-leaf-drift 6.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .leaf-2 { animation-duration: 7.8s; animation-delay: -2.1s; opacity: .76; } .leaf-3 { animation-duration: 5.9s; animation-delay: -4.2s; opacity: .88; } .leaf-4 { animation-duration: 8.6s; animation-delay: -1.3s; opacity: .68; } .leaf-5 { animation-duration: 7.1s; animation-delay: -5.4s; opacity: .82; } .leaf-6 { animation-duration: 9.2s; animation-delay: -3.2s; opacity: .72; } .leaf-7 { animation-duration: 7.5s; animation-delay: -1.7s; } .leaf-8 { animation-duration: 6.7s; animation-delay: -4.8s; } .leaf-9 { animation-duration: 8.2s; animation-delay: -2.6s; } @keyframes earth-leaf-drift { 0%, 100% { transform: translate(0, -4px) rotate(-8deg); } 50% { transform: translate(8px, 10px) rotate(24deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-earth behavior-idle"><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-young" data-anatomy-stage="young"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M98 180 C69 196 42 179 42 151 C42 126 61 108 82 112 C101 116 106 136 94 147 C84 156 69 151 68 140 C67 132 75 126 83 130" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-young" opacity="0.78" transform="translate(128 125) scale(.96) translate(-128 -125)"><path d="M88 171 C60 184 38 166 36 142 C34 119 50 96 71 91" fill="none" stroke="#5f8f4a" stroke-width="7" stroke-linecap="round"/><path d="M45 132 C55 128 63 132 65 141 C56 145 48 141 45 132Z" fill="#79a85d"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M111 128 C97 141 96 171 102 194 C108 211 145 215 160 199 C176 181 166 143 151 130 C140 121 122 120 111 128Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 151 161 C140 166 125 164 110 158 C106 163 107 169 110 174Z" fill="#c9d9ac" opacity=".72"/><g class="stage-class-markings stage-class-markings-young" opacity="0.78" transform="translate(128 125) scale(.96) translate(-128 -125)"><path d="M118 157 C127 151 136 154 137 163 C129 169 120 166 118 157Z" fill="#5f8f4a" opacity=".85"/><path d="M143 179 C151 174 158 179 155 187 C148 188 143 185 143 179Z" fill="#5f8f4a" opacity=".65"/></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M102 86 C82 78 58 70 49 83 C43 94 55 105 72 105 C84 102 95 95 102 86Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M136 79 C136 58 143 39 153 32 C162 45 161 66 149 88Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-young" opacity="0.78" transform="translate(128 125) scale(.96) translate(-128 -125)"><path d="M95 89 C79 88 63 84 57 92 C65 100 80 98 96 92Z" fill="#5f8f4a"/><path d="M143 78 C144 63 148 51 151 47 C156 55 154 69 149 82Z" fill="#5f8f4a"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M103 75 C89 85 85 106 90 123 C96 143 134 153 153 137 C169 123 165 96 150 82 C138 71 116 68 103 75Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-young" opacity="0.78" transform="translate(128 125) scale(.96) translate(-128 -125)"><path d="M122 91 C126 84 134 84 138 91 C133 99 127 99 122 91Z" fill="#5f8f4a"/></g><g transform="translate(128 114) rotate(-2) translate(-128 -114)"><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#17283b"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#17283b"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#17283b" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#17283b" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M101 192 C94 198 96 210 107 212 C117 213 122 204 116 197Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M146 195 C139 201 142 211 153 212 C163 211 167 202 159 197Z" fill="#f3eddf" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 202 L106 198 M111 204 L113 200 M148 203 L151 199 M156 204 L158 200" stroke="#17283b" stroke-width="1.8" stroke-linecap="round"/></g></g></g></g></svg>
