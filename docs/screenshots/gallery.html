<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>GittyGotchi visual QA</title>
	<style>
		:root { font-family: ui-sans-serif, system-ui, sans-serif; }
		body { margin: 0; }
		section { padding: 1.5rem; }
		.light { background: #ffffff; color: #1f2328; }
		.dark { background: #0d1117; color: #f0f6fc; }
		h1, h2 { font-size: 1.1rem; }
		.row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; }
		figure { margin: 0; text-align: center; }
		figcaption { font-size: 0.8rem; margin-top: 0.25rem; }
		img { width: 120px; height: 120px; display: block; }
		img.large { width: 240px; height: 240px; }
	</style>
</head>
<body>
	<section class="light">
		<h1>GitHub light (#ffffff)</h1>
		<h2>Stages</h2>
		<div class="row">
			<figure><img src="stage-egg.svg" alt="egg"><figcaption>egg</figcaption></figure><figure><img src="stage-hatchling.svg" alt="hatchling"><figcaption>hatchling</figcaption></figure><figure><img src="stage-baby.svg" alt="baby"><figcaption>baby</figcaption></figure><figure><img src="stage-young.svg" alt="young"><figcaption>young</figcaption></figure><figure><img src="stage-adult.svg" alt="adult"><figcaption>adult</figcaption></figure><figure><img src="stage-mature.svg" alt="mature"><figcaption>mature</figcaption></figure>
		</div>
		<h2>Classes (adult)</h2>
		<div class="row">
			<figure><img src="class-earth.svg" alt="earth"><figcaption>earth</figcaption></figure><figure><img src="class-water.svg" alt="water"><figcaption>water</figcaption></figure><figure><img src="class-air.svg" alt="air"><figcaption>air</figcaption></figure><figure><img src="class-fire.svg" alt="fire"><figcaption>fire</figcaption></figure><figure><img src="class-psy.svg" alt="psy"><figcaption>psy</figcaption></figure>
		</div>
		<h2>Error</h2>
		<figure><img class="large" src="error-hiding.svg" alt="error"><figcaption>invalid username</figcaption></figure>
	</section>
	<section class="dark">
		<h1>GitHub dark (#0d1117)</h1>
		<h2>Stages</h2>
		<div class="row">
			<figure><img src="stage-egg.svg" alt="egg"><figcaption>egg</figcaption></figure><figure><img src="stage-hatchling.svg" alt="hatchling"><figcaption>hatchling</figcaption></figure><figure><img src="stage-baby.svg" alt="baby"><figcaption>baby</figcaption></figure><figure><img src="stage-young.svg" alt="young"><figcaption>young</figcaption></figure><figure><img src="stage-adult.svg" alt="adult"><figcaption>adult</figcaption></figure><figure><img src="stage-mature.svg" alt="mature"><figcaption>mature</figcaption></figure>
		</div>
		<h2>Classes (adult)</h2>
		<div class="row">
			<figure><img src="class-earth.svg" alt="earth"><figcaption>earth</figcaption></figure><figure><img src="class-water.svg" alt="water"><figcaption>water</figcaption></figure><figure><img src="class-air.svg" alt="air"><figcaption>air</figcaption></figure><figure><img src="class-fire.svg" alt="fire"><figcaption>fire</figcaption></figure><figure><img src="class-psy.svg" alt="psy"><figcaption>psy</figcaption></figure>
		</div>
	</section>
</body>
</html>
