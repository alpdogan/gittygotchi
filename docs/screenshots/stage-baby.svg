<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-gitty-class="earth" data-gitty-stage="baby" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>earth baby looking happy.</desc><style> .gitty-idle { animation: gitty-bob 2.6s ease-in-out infinite; } .gitty-playing { animation: gitty-play 0.7s ease-in-out infinite; } .gitty-eating { animation: gitty-nibble 0.55s ease-in-out infinite; } .gitty-resting { animation: gitty-bob 4s ease-in-out infinite; } .gitty-sleepy { animation: gitty-bob 3.4s ease-in-out infinite; } .gitty-sleeping, .gitty-hibernating { animation: gitty-breathe 4.8s ease-in-out infinite; } .gitty-playing .gitty-tail { animation: gitty-wag 0.8s ease-in-out infinite; } .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: gitty-ear 2.8s ease-in-out infinite; } .gitty-bubble { animation: gitty-rise 3s ease-in-out infinite; } .gitty-flame { animation: gitty-flicker 0.9s ease-in-out infinite; } .gitty-spark { animation: gitty-flicker 1.2s ease-in-out infinite; } .gitty-psy { animation: gitty-float 2.8s ease-in-out infinite; } .gitty-zzz { animation: gitty-fade 2.2s ease-in-out infinite; } .gitty-orbit { animation: gitty-spin 6s linear infinite; } @keyframes gitty-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } } @keyframes gitty-play { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-6px) rotate(-5deg); } 70% { transform: translateY(-2px) rotate(5deg); } } @keyframes gitty-nibble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } } @keyframes gitty-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } } @keyframes gitty-wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } } @keyframes gitty-ear { 0%, 78%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-9deg); } } @keyframes gitty-rise { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 0.9; transform: translateY(-8px); } } @keyframes gitty-flicker { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } } @keyframes gitty-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes gitty-fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } } @keyframes gitty-spin { to { transform: rotate(360deg); } } @media (max-width: 96px) { .gitty-detail { display: none; } } @media (prefers-reduced-motion: reduce) { .gitty-idle, .gitty-playing, .gitty-eating, .gitty-resting, .gitty-sleepy, .gitty-sleeping, .gitty-hibernating, .gitty-bubble, .gitty-flame, .gitty-spark, .gitty-psy, .gitty-zzz, .gitty-orbit, .gitty-playing .gitty-tail, .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: none; } } </style><rect width="240" height="240" rx="28" fill="#f7f1e6" stroke="#cbbda3" stroke-width="3"/><g transform="translate(120 150) scale(1) translate(-120 -150)"><g class="gitty-idle"><g data-gitty-body="baby"><ellipse cx="120" cy="200" rx="50" ry="10" fill="#d9c89a" opacity="0.45"/><g transform="translate(162 160)"><g class="gitty-tail"><path d="M0 0 q22 -6 28 -22" fill="none" stroke="#6f8f4e" stroke-width="11" stroke-linecap="round"/></g></g><g transform="translate(92 100) rotate(-26)"><g class="gitty-ear"><ellipse cx="0" cy="-18" rx="14" ry="24" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3.5"/><ellipse cx="0" cy="-16" rx="5.5" ry="11" fill="#c5d6a8"/></g></g><g transform="translate(148 100) rotate(26)"><g class="gitty-ear"><ellipse cx="0" cy="-18" rx="14" ry="24" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3.5"/><ellipse cx="0" cy="-16" rx="5.5" ry="11" fill="#c5d6a8"/></g></g><ellipse cx="120" cy="142" rx="52" ry="48" fill="#efe3c4" stroke="#3d2c1e" stroke-width="4"/><ellipse cx="120" cy="156" rx="24" ry="16" fill="#c5d6a8" opacity="0.45"/><ellipse cx="100" cy="186" rx="12" ry="8" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3"/><ellipse cx="140" cy="186" rx="12" ry="8" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3"/></g><g class="gitty-earth" fill="#6f8f4e" stroke="#3d2c1e" stroke-width="2"><path d="M62 116 q8 -16 2 -26 q12 8 10 24z"/><path d="M168 114 q-4 -14 4 -24 q10 10 2 24z"/><ellipse class="gitty-detail" cx="100" cy="168" rx="5" ry="3.5" opacity="0.7"/><ellipse class="gitty-detail" cx="142" cy="172" rx="4" ry="3" opacity="0.55"/></g><path d="M96 138 q8 8 16 0" fill="none" stroke="#3d2c1e" stroke-width="3.5" stroke-linecap="round"/><path d="M128 138 q8 8 16 0" fill="none" stroke="#3d2c1e" stroke-width="3.5" stroke-linecap="round"/><path d="M110 158 q10 12 20 0" fill="none" stroke="#3d2c1e" stroke-width="3.5" stroke-linecap="round"/></g></g></svg>
