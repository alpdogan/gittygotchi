<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="fire" data-prototype-stage="hatchling" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="none" data-gitty-class="fire" data-gitty-stage="hatchling" data-gitty-body="hatchling" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>fire hatchling looking happy.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-fire .gitty-tail { animation: fire-tail-idle 2.2s ease-in-out infinite; } .fire-flame, .fire-tail-flame { animation: fire-flicker 1.35s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .flame-2 { animation-duration: 1.08s; animation-delay: -.54s; } .flame-3 { animation-duration: 1.62s; animation-delay: -.91s; } .flame-4 { animation-duration: 1.48s; animation-delay: -.72s; } .fire-tail-flame { animation-duration: 1.8s; animation-delay: -.35s; } .fire-tail-glow { animation: fire-flicker 1.12s ease-in-out infinite; } .fire-ember { animation: fire-ember 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; } .ember-2 { animation-duration: 4.1s; animation-delay: -2.3s; } .ember-3 { animation-duration: 2.7s; animation-delay: -1.1s; } .ember-4 { animation-duration: 3.8s; animation-delay: -3s; } .ember-5 { animation-duration: 3.5s; animation-delay: -2.6s; } .ember-6 { animation-duration: 4.3s; animation-delay: -1.8s; } @keyframes fire-flicker { 0%, 100% { opacity: .82; transform: translateY(1px) scale(.94, .9) rotate(-2deg); } 50% { opacity: 1; transform: translateY(-2px) scale(1.04, 1.12) rotate(2deg); } } @keyframes fire-ember { 0% { opacity: 0; transform: translate(0, 8px) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(5px, -20px) scale(.25); } } @keyframes fire-tail-idle { 0%, 100% { transform: rotate(-2deg); } 45% { transform: rotate(4deg); } 70% { transform: rotate(1deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-fire behavior-idle"><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-hatchling" data-anatomy-stage="hatchling"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M106 177 C90 184 78 173 80 159 C82 147 94 142 102 149 C108 154 105 164 98 164 C93 164 91 158 95 155" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-hatchling" opacity="0.42" transform="translate(128 126) scale(.72) translate(-128 -126)"></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M109 143 C99 151 98 172 105 188 C112 201 139 203 149 190 C158 177 155 153 145 144 C135 136 118 136 109 143Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 151 161 C140 166 125 164 110 158 C106 163 107 169 110 174Z" fill="#f5ad4e" opacity=".72"/><g class="stage-class-markings stage-class-markings-hatchling" opacity="0.42" transform="translate(128 126) scale(.72) translate(-128 -126)"></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M104 96 C87 83 66 80 58 91 C55 101 66 110 82 108 C91 107 99 103 104 96Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M137 88 C138 71 145 56 153 52 C162 63 159 80 149 94Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-hatchling" opacity="0.42" transform="translate(128 126) scale(.72) translate(-128 -126)"><path d="M95 89 C79 87 64 84 57 92 C68 101 82 97 96 92Z" fill="#ef6437"/><path d="M143 78 C144 62 148 50 152 45 C159 56 155 71 149 84Z" fill="#ef6437"/><path d="M148 76 C149 67 152 59 154 55" fill="none" stroke="#f5ad4e" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M101 91 C91 99 89 121 97 136 C105 150 139 151 151 137 C162 124 159 101 148 91 C136 80 113 81 101 91Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-hatchling" opacity="0.42" transform="translate(128 126) scale(.72) translate(-128 -126)"><path d="M129 82 C139 91 136 101 128 103 C119 99 121 90 129 82Z" fill="#ef6437"/><path d="M129 89 C133 94 131 98 128 99 C125 97 126 93 129 89Z" fill="#f5ad4e"/></g><g transform="translate(128 115) scale(.82) translate(-128 -115)"><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#2b2632"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#2b2632"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#2b2632" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#2b2632" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M105 184 C98 188 101 197 111 198 C119 198 122 191 116 186Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M139 185 C133 190 137 198 147 198 C155 197 157 190 150 186Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 202 L106 198 M111 204 L113 200 M148 203 L151 199 M156 204 L158 200" stroke="#2b2632" stroke-width="1.8" stroke-linecap="round"/></g></g><g class="hatchling-shell"><path d="M75 177 L89 166 L102 180 L116 164 L131 179 L147 165 L163 178 L177 168 L174 199 C155 216 96 216 77 198Z" fill="#f5e8dc" stroke="#2b2632" stroke-width="4" stroke-linejoin="round"/><path d="M88 198 C108 205 145 205 164 196" fill="none" stroke="#f5ad4e" stroke-width="5" stroke-linecap="round"/></g></g></g><g class="gitty-status-labels" data-gitty-status-labels="hunger mood sleep"><rect x="14" y="205" width="212" height="27" rx="10" fill="#f3ead7"/><text x="49" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Hunger</text><text x="49" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Normal</text><text x="120" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Mood</text><text x="120" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Happy</text><text x="191" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Sleep</text><text x="191" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Awake</text></g></svg>
