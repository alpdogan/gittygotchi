<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="psy" data-prototype-stage="baby" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="none" data-gitty-class="psy" data-gitty-stage="baby" data-gitty-body="baby" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>psy baby looking happy.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-psy .gitty-character { animation: psy-float 3.6s ease-in-out infinite; } .class-psy .gitty-shadow { animation: psy-shadow 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .psy-particle { animation: psy-particle 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .particle-2 { animation-duration: 6.4s; animation-delay: -2.7s; } .particle-3 { animation-duration: 4.7s; animation-delay: -1.2s; } .particle-4 { animation-duration: 7.1s; animation-delay: -4.4s; } .particle-5 { animation-duration: 5.8s; animation-delay: -3.1s; } .particle-6 { animation-duration: 6.8s; animation-delay: -5.3s; } .particle-7 { animation-duration: 5.5s; animation-delay: -2.2s; } .particle-8 { animation-duration: 6.1s; animation-delay: -4.7s; } .particle-9 { animation-duration: 7.4s; animation-delay: -1.6s; } .psy-aura { animation: psy-aura 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes psy-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } @keyframes psy-shadow { 0%, 100% { opacity: .34; transform: scaleX(1); } 50% { opacity: .22; transform: scaleX(.82); } } @keyframes psy-aura { 0%, 100% { opacity: .42; transform: scale(.98); } 50% { opacity: .68; transform: scale(1.02); } } @keyframes psy-particle { 0%, 100% { opacity: .35; transform: translate(0, 4px) rotate(-8deg); } 50% { opacity: 1; transform: translate(7px, -9px) rotate(18deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-psy behavior-idle"><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-baby" data-anatomy-stage="baby"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M102 180 C78 192 59 178 59 157 C59 139 74 128 88 134 C101 140 101 155 92 161 C84 166 76 161 78 153 C79 148 84 146 89 149" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path d="M88 171 C63 184 41 169 37 148 C33 127 43 105 60 96" fill="none" stroke="#7d53c7" stroke-width="8" stroke-linecap="round"/><path d="M82 166 C65 174 51 164 50 151 C49 140 57 132 67 132" fill="none" stroke="#c2a5e5" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 5"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M108 137 C95 148 94 177 103 195 C112 211 146 212 159 197 C171 181 164 149 151 138 C140 128 119 128 108 137Z" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 151 161 C140 166 125 164 110 158 C106 163 107 169 110 174Z" fill="#c2a5e5" opacity=".72"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path d="M116 157 L128 150 L140 157 L136 170 L121 171Z" fill="#7d53c7" opacity=".78"/><circle cx="128" cy="161" r="4" fill="#c2a5e5"/></g></g><g class="gitty-ears"><path data-anatomy-part="left-ear" d="M103 88 C82 75 55 69 46 83 C39 95 53 108 72 106 C84 104 96 97 103 88Z" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-ear" d="M136 78 C136 55 145 35 155 29 C166 43 164 65 150 86Z" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path d="M95 89 C79 87 64 84 57 92 C68 101 82 97 96 92Z" fill="#7d53c7"/><path d="M143 78 C144 62 148 50 152 45 C159 56 155 71 149 84Z" fill="#7d53c7"/><path d="M148 76 C149 66 152 58 154 54" fill="none" stroke="#c2a5e5" stroke-width="3" stroke-linecap="round"/></g></g><g class="gitty-head"><path data-anatomy-part="head" d="M98 77 C84 89 82 115 91 134 C101 154 143 157 158 137 C170 121 166 94 151 80 C138 68 112 67 98 77Z" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-baby" opacity="0.58" transform="translate(126 117) scale(1.05) translate(-126 -117)"><path d="M129 80 L139 93 L129 105 L119 93Z" fill="#7d53c7" stroke="#24243a" stroke-width="2"/><path d="M129 85 L133 93 L129 99 L125 93Z" fill="#c2a5e5"/><path d="M101 111 C105 105 112 105 116 110 M133 107 C138 102 145 103 149 108" fill="none" stroke="#7d53c7" stroke-width="2.2" stroke-linecap="round" opacity=".8"/></g><g transform="translate(126 112) scale(1.08) translate(-126 -112)"><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#24243a"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#24243a"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#24243a" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#24243a" stroke-