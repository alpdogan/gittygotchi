<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-gitty-class="psy" data-gitty-stage="baby" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>psy baby looking happy.</desc><style> .gitty-idle { animation: gitty-bob 2.6s ease-in-out infinite; } .gitty-playing { animation: gitty-play 0.7s ease-in-out infinite; } .gitty-eating { animation: gitty-nibble 0.55s ease-in-out infinite; } .gitty-resting { animation: gitty-bob 4s ease-in-out infinite; } .gitty-sleepy { animation: gitty-bob 3.4s ease-in-out infinite; } .gitty-sleeping, .gitty-hibernating { animation: gitty-breathe 4.8s ease-in-out infinite; } .gitty-playing .gitty-tail { animation: gitty-wag 0.8s ease-in-out infinite; } .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: gitty-ear 2.8s ease-in-out infinite; } .gitty-bubble { animation: gitty-rise 3s ease-in-out infinite; } .gitty-flame { animation: gitty-flicker 0.9s ease-in-out infinite; } .gitty-spark { animation: gitty-flicker 1.2s ease-in-out infinite; } .gitty-psy { animation: gitty-float 2.8s ease-in-out infinite; } .gitty-zzz { animation: gitty-fade 2.2s ease-in-out infinite; } .gitty-orbit { animation: gitty-spin 6s linear infinite; } .gitty-shadow-idle { animation: gitty-shadow-bob 2.6s ease-in-out infinite; } .gitty-shadow-playing { animation: gitty-shadow-play 0.7s ease-in-out infinite; } .gitty-shadow-eating { animation: gitty-shadow-nibble 0.55s ease-in-out infinite; } .gitty-shadow-resting { animation: gitty-shadow-bob 4s ease-in-out infinite; } .gitty-shadow-sleepy { animation: gitty-shadow-bob 3.4s ease-in-out infinite; } .gitty-shadow-sleeping, .gitty-shadow-hibernating { animation: gitty-shadow-breathe 4.8s ease-in-out infinite; } @keyframes gitty-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } } @keyframes gitty-play { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-6px) rotate(-5deg); } 70% { transform: translateY(-2px) rotate(5deg); } } @keyframes gitty-nibble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } } @keyframes gitty-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } } @keyframes gitty-wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } } @keyframes gitty-ear { 0%, 78%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-9deg); } } @keyframes gitty-rise { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 0.9; transform: translateY(-8px); } } @keyframes gitty-flicker { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } } @keyframes gitty-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes gitty-fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } } @keyframes gitty-spin { to { transform: rotate(360deg); } } @keyframes gitty-shadow-bob { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.72); } } @keyframes gitty-shadow-play { 0%, 100% { transform: scale(1); } 30% { transform: scale(0.58); } 70% { transform: scale(0.82); } } @keyframes gitty-shadow-nibble { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } } @keyframes gitty-shadow-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } } @media (max-width: 96px) { .gitty-detail { display: none; } } @media (prefers-reduced-motion: reduce) { .gitty-idle, .gitty-playing, .gitty-eating, .gitty-resting, .gitty-sleepy, .gitty-sleeping, .gitty-hibernating, .gitty-bubble, .gitty-flame, .gitty-spark, .gitty-psy, .gitty-zzz, .gitty-orbit, .gitty-playing .gitty-tail, .gitty-idle .gitty-ear, .gitty-playing .gitty-ear, .gitty-shadow-idle, .gitty-shadow-playing, .gitty-shadow-eating, .gitty-shadow-resting, .gitty-shadow-sleepy, .gitty-shadow-sleeping, .gitty-shadow-hibernating { animation: none; } } </style><rect width="240" height="240" rx="28" fill="#f7f1e6" stroke="#cbbda3" stroke-width="3"/><g transform="translate(120 150) scale(1) translate(-120 -150)"><g transform="translate(120 202)"><g class="gitty-shadow gitty-shadow-idle"><ellipse cx="0" cy="0" rx="46" ry="9" fill="#c7b0dc" opacity="0.45"/></g></g><g class="gitty-idle"><g data-gitty-body="baby"><g transform="translate(154 158)"><g class="gitty-tail"><path d="M0 4 C12 0 22 -10 20 -22 C28 -4 16 22 -4 16 C-10 12 -8 8 0 4Z" fill="#6941a0" stroke="#322044" stroke-width="3"/></g></g><g transform="translate(96 112) rotate(-16) scale(0.72)"><g class="gitty-ear"><path d="M0 6 C-12 2 -14 -18 -5 -34 Q0 -41 5 -34 C14 -18 12 2 0 6Z" fill="#e6d7f4" stroke="#322044" stroke-width="3.2"/><path d="M0 1 C-5 0 -6 -12 -2 -24 Q0 -27 2 -24 C6 -12 5 0 0 1Z" fill="#d0b6ea"/></g></g><g transform="translate(144 112) rotate(16) scale(0.72)"><g class="gitty-ear"><path d="M0 6 C-12 2 -14 -18 -5 -34 Q0 -41 5 -34 C14 -18 12 2 0 6Z" fill="#e6d7f4" stroke="#322044" stroke-width="3.2"/><path d="M0 1 C-5 0 -6 -12 -2 -24 Q0 -27 2 -24 C6 -12 5 0 0 1Z" fill="#d0b6ea"/></g></g><circle cx="120" cy="146" r="50" fill="#e6d7f4" stroke="#322044" stroke-width="4"/><ellipse cx="120" cy="160" rx="22" ry="14" fill="#d0b6ea" opacity="0.5"/><ellipse cx="102" cy="192" rx="11" ry="7" fill="#e6d7f4" stroke="#322044" stroke-width="3"/><ellipse cx="138" cy="192" rx="11" ry="7" fill="#e6d7f4" stroke="#322044" stroke-width="3"/></g><g class="gitty-psy" fill="#6941a0" stroke="#322044" stroke-width="2"><path d="M120 108 l10 12 -10 12 -10 -12z"/><circle cx="58" cy="108" r="4"/><circle cx="186" cy="92" r="3.2"/><circle class="gitty-detail" cx="52" cy="78" r="2.6"/></g><circle cx="104" cy="140" r="7" fill="#322044"/><circle cx="136" cy="140" r="7" fill="#322044"/><circle cx="106" cy="137.8" r="2.3" fill="#fff7ea"/><circle cx="138" cy="137.8" r="2.3" fill="#fff7ea"/><ellipse cx="94" cy="150" rx="6" ry="3.5" fill="#6941a0" opacity="0.35"/><ellipse cx="146" cy="150" rx="6" ry="3.5" fill="#6941a0" opacity="0.35"/><path