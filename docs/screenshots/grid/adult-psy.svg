<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="psy" data-prototype-stage="adult" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="adult" data-gitty-class="psy" data-gitty-stage="adult" data-gitty-body="adult" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>psy adult looking happy.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-psy .gitty-character { animation: psy-float 3.6s ease-in-out infinite; } .class-psy .gitty-shadow { animation: psy-shadow 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .psy-particle { animation: psy-particle 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .particle-2 { animation-duration: 6.4s; animation-delay: -2.7s; } .particle-3 { animation-duration: 4.7s; animation-delay: -1.2s; } .particle-4 { animation-duration: 7.1s; animation-delay: -4.4s; } .particle-5 { animation-duration: 5.8s; animation-delay: -3.1s; } .particle-6 { animation-duration: 6.8s; animation-delay: -5.3s; } .particle-7 { animation-duration: 5.5s; animation-delay: -2.2s; } .particle-8 { animation-duration: 6.1s; animation-delay: -4.7s; } .particle-9 { animation-duration: 7.4s; animation-delay: -1.6s; } .psy-aura { animation: psy-aura 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes psy-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } @keyframes psy-shadow { 0%, 100% { opacity: .34; transform: scaleX(1); } 50% { opacity: .22; transform: scaleX(.82); } } @keyframes psy-aura { 0%, 100% { opacity: .42; transform: scale(.98); } 50% { opacity: .68; transform: scale(1.02); } } @keyframes psy-particle { 0%, 100% { opacity: .35; transform: translate(0, 4px) rotate(-8deg); } 50% { opacity: 1; transform: translate(7px, -9px) rotate(18deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-psy behavior-idle"><g data-effect-tier="adult"><g stroke="#7d53c7" stroke-width="2"><path class="psy-particle particle-1" data-effect-element="particle" d="M48 91 L55 99 L48 107 L41 99Z" fill="#c2a5e5"/><circle class="psy-particle particle-2" data-effect-element="particle" cx="195" cy="88" r="6" fill="none"/><path class="psy-particle particle-3" data-effect-element="particle" d="M205 157 L211 163 L205 169 L199 163Z" fill="#7d53c7"/><circle class="psy-particle particle-4" data-effect-element="particle" cx="50" cy="180" r="4" fill="#c2a5e5"/></g></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-adult" data-anatomy-stage="adult"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M94 178 C62 197 29 179 27 145 C25 112 48 82 76 82 C101 82 116 101 108 121 C102 138 84 148 69 140 C56 134 54 119 62 109 C68 102 79 101 86 107 C77 106 70 112 70 120 C70 128 80 132 88 126 C101 116 96 97 79 94 C59 91 42 112 43 137 C44 159 62 173 84 167 C88 166 92 170 94 178Z" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M88 171 C63 184 41 169 37 148 C33 127 43 105 60 96" fill="none" stroke="#7d53c7" stroke-width="8" stroke-linecap="round"/><path d="M82 166 C65 174 51 164 50 151 C49 140 57 132 67 132" fill="none" stroke="#c2a5e5" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 5"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M118 130 C102 136 94 151 94 173 C94 195 106 207 124 209 C142 211 164 207 171 190 C179 171 168 142 151 132