necap="round" opacity=".8"/></g><g><g class="gitty-face face-happy"><g class="gitty-eyes"><ellipse cx="108" cy="112" rx="7" ry="10" fill="#24243a"/><ellipse cx="140" cy="109" rx="6.5" ry="9.5" fill="#24243a"/><ellipse cx="105.5" cy="108.5" rx="2.2" ry="3" fill="#fffdf8"/><ellipse cx="137.8" cy="105.8" rx="2" ry="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#24243a" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#24243a" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M101 192 C94 195 94 205 103 208 C111 210 119 207 119 201 C118 195 108 190 101 192Z" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M143 194 C137 198 139 207 148 209 C157 211 164 207 163 201 C161 195 150 191 143 194Z" fill="#f0e9ef" stroke="#24243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 202 L106 198 M111 204 L113 200 M148 203 L151 199 M156 204 L158 200" stroke="#24243a" stroke-width="1.8" stroke-linecap="round"/></g></g></g><g data-effect-tier="adult"><path class="psy-particle particle-5" data-effect-element="particle" d="M179 48 L185 56 L179 64 L173 56Z" fill="#c2a5e5" stroke="#7d53c7" stroke-width="2"/><path class="psy-particle particle-6" data-effect-element="particle" d="M192 202 L198 208 L192 214 L186 208Z" fill="#7d53c7"/></g></g><g class="gitty-status-labels" data-gitty-status-labels="hunger mood sleep"><rect x="14" y="205" width="212" height="27" rx="10" fill="#f3ead7"/><text x="49" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Hunger</text><text x="49" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Normal</text><text x="120" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Mood</text><text x="120" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Happy</text><text x="191" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Sleep</text><text x="191" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Awake</text></g></svg>
