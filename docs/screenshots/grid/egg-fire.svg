<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-gitty-class="fire" data-gitty-stage="egg" data-gitty-behavior="idle" data-gitty-face="neutral"><title>GittyGotchi for @alpdogan</title><desc>fire egg looking neutral.</desc><style> .gitty-idle { animation: gitty-bob 2.6s ease-in-out infinite; } .gitty-playing { animation: gitty-play 0.7s ease-in-out infinite; } .gitty-eating { animation: gitty-nibble 0.55s ease-in-out infinite; } .gitty-resting { animation: gitty-bob 4s ease-in-out infinite; } .gitty-sleepy { animation: gitty-bob 3.4s ease-in-out infinite; } .gitty-sleeping, .gitty-hibernating { animation: gitty-breathe 4.8s ease-in-out infinite; } .gitty-playing .gitty-tail { animation: gitty-wag 0.8s ease-in-out infinite; } .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: gitty-ear 2.8s ease-in-out infinite; } .gitty-bubble { animation: gitty-rise 3s ease-in-out infinite; } .gitty-flame { animation: gitty-flicker 0.9s ease-in-out infinite; } .gitty-spark { animation: gitty-flicker 1.2s ease-in-out infinite; } .gitty-psy { animation: gitty-float 2.8s ease-in-out infinite; } .gitty-zzz { animation: gitty-fade 2.2s ease-in-out infinite; } .gitty-orbit { animation: gitty-spin 6s linear infinite; } .gitty-shadow-idle { animation: gitty-shadow-bob 2.6s ease-in-out infinite; } .gitty-shadow-playing { animation: gitty-shadow-play 0.7s ease-in-out infinite; } .gitty-shadow-eating { animation: gitty-shadow-nibble 0.55s ease-in-out infinite; } .gitty-shadow-resting { animation: gitty-shadow-bob 4s ease-in-out infinite; } .gitty-shadow-sleepy { animation: gitty-shadow-bob 3.4s ease-in-out infinite; } .gitty-shadow-sleeping, .gitty-shadow-hibernating { animation: gitty-shadow-breathe 4.8s ease-in-out infinite; } @keyframes gitty-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } } @keyframes gitty-play { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-6px) rotate(-5deg); } 70% { transform: translateY(-2px) rotate(5deg); } } @keyframes gitty-nibble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } } @keyframes gitty-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } } @keyframes gitty-wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } } @keyframes gitty-ear { 0%, 78%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-9deg); } } @keyframes gitty-rise { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 0.9; transform: translateY(-8px); } } @keyframes gitty-flicker { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } } @keyframes gitty-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes gitty-fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } } @keyframes gitty-spin { to { transform: rotate(360deg); } } @keyframes gitty-shadow-bob { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.72); } } @keyframes gitty-shadow-play { 0%, 100% { transform: scale(1); } 30% { transform: scale(0.58); } 70% { transform: scale(0.82); } } @keyframes gitty-shadow-nibble { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } } @keyframes gitty-shadow-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } } @media (max-width: 96px) { .gitty-detail { display: none; } } @media (prefers-reduced-motion: reduce) { .gitty-idle, .gitty-playing, .gitty-eating, .gitty-resting, .gitty-sleepy, .gitty-sleeping, .gitty-hibernating, .gitty-bubble, .gitty-flame, .gitty-spark, .gitty-psy, .gitty-zzz, .gitty-orbit, .gitty-playing .gitty-tail, .gitty-idle .gitty-ear, .gitty-playing .gitty-ear, .gitty-shadow-idle, .gitty-shadow-playing, .gitty-shadow-eating, .gitty-shadow-resting, .gitty-shadow-sleepy, .gitty-shadow-sleeping, .gitty-shadow-hibernating { animation: none; } } </style><rect width="240" height="240" rx="28" fill="#f7f1e6" stroke="#cbbda3" stroke-width="3"/><g transform="translate(120 150) scale(1) translate(-120 -150)"><g transform="translate(120 198)"><g class="gitty-shadow gitty-shadow-idle"><ellipse cx="0" cy="0" rx="48" ry="10" fill="#e3b08e" opacity="0.45"/></g></g><g class="gitty-idle"><g data-gitty-body="egg"><ellipse cx="120" cy="130" rx="54" ry="68" fill="#f8d9c4" stroke="#5a2612" stroke-width="4"/><ellipse cx="118" cy="86" rx="28" ry="14" fill="#fffdf6" opacity="0.62"/><ellipse class="gitty-detail" cx="96" cy="148" rx="6" ry="4.5" fill="#e05a24" opacity="0.4"/><ellipse class="gitty-detail" cx="150" cy="140" rx="4.5" ry="3.5" fill="#e05a24" opacity="0.32"/></g><path class="gitty-flame" d="M168 78 c10 12 8 26 -2 34 c-12 -10 -10 -22 2 -34z" fill="#e05a24" stroke="#5a2612" stroke-width="2"/><circle cx="104" cy="126" r="7" fill="#5a2612"/><circle cx="136" cy="126" r="7" fill="#5a2612"/><circle cx="106" cy="124" r="2.2" fill="#fff7ea"/><circle cx="138" cy="124" r="2.2" fill="#fff7ea"/><ellipse cx="95" cy="136" rx="5" ry="3" fill="#e05a24" opacity="0.22"/><ellipse cx="145" cy="136" rx="5" ry="3" fill="#e05a24" opacity="0.22"/><path d="M110 150 q10 8 20 0" fill="none" stroke="#5a2612" stroke-width="3.5" stroke-linecap="round"/></g></g></svg>
