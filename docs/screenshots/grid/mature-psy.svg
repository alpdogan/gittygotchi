<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="psy" data-prototype-stage="mature" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="mature" data-gitty-class="psy" data-gitty-stage="mature" data-gitty-body="mature" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>psy mature looking happy.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-psy .gitty-character { animation: psy-float 3.6s ease-in-out infinite; } .class-psy .gitty-shadow { animation: psy-shadow 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .psy-particle { animation: psy-particle 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .particle-2 { animation-duration: 6.4s; animation-delay: -2.7s; } .particle-3 { animation-duration: 4.7s; animation-delay: -1.2s; } .particle-4 { animation-duration: 7.1s; animation-delay: -4.4s; } .particle-5 { animation-duration: 5.8s; animation-delay: -3.1s; } .particle-6 { animation-duration: 6.8s; animation-delay: -5.3s; } .particle-7 { animation-duration: 5.5s; animation-delay: -2.2s; } .particle-8 { animation-duration: 6.1s; animation-delay: -4.7s; } .particle-9 { animation-duration: 7.4s; animation-delay: -1.6s; } .psy-aura { animation: psy-aura 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes psy-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } @keyframes psy-shadow { 0%, 100% { opacity: .34; transform: scaleX(1); } 50% { opacity: .22; transform: scaleX(.82); } } @keyframes psy-aura { 0%, 100% { opacity: .42; transform: scale(.98); } 50% { opacity: .68; transform: scale(1.02); } } @keyframes psy-particle { 0%, 100% { opacity: .35; transform: translate(0, 4px) rotate(-8deg); } 50% { opacity: 1; transform: translate(7px, -9px) rotate(18deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-psy behavior-idle"><g data-effect-tier="adult"><g stroke="#7d53c7" stroke-width="2"><path class="psy-particle particle-1" data-effect-element="particle" d="M48 91 L55 99 L48 107 L41 99Z" fill="#c2a5e5"/><circle class="psy-particle particle-2" data-effect-element="particle" cx="195" cy="88" r="6" fill="none"/><path class="psy-particle particle-3" data-effect-element="particle" d="M205 157 L211 163 L205 169 L199 163Z" fill="#7d53c7"/><circle class="psy-particle particle-4" data-effect-element="particle" cx="50" cy="180" r="4" fill="#c2a5e5"/></g></g><g data-effect-tier="mature"><ellipse class="psy-aura" data-effect-element="aura" cx="128" cy="130" rx="82" ry="91" fill="none" stroke="#c2a5e5" stroke-width="3" stroke-dasharray="12 9" opacity=".55"/><path class="psy-particle particle-7" data-effect-element="particle" d="M27 135 L35 143 L27 151 L19 143Z" fill="#c2a5e5" stroke="#7d53c7" stroke-width="2"/></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-mature" data-anatomy-stage="mature"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M101 183 C69 204 29 188 24 151 C19 114 46 78 79 79 C107 80 123 102 113 125 C104 146 78 152 61 138 C48 128 48 109 61 99 C73 90 91 95 95 108 C99 120 90 132 79 131 C71 130 66 123 69 116 C71 111 77 109 82 112" fill="none" stroke="#24243a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M101 183 C69 204 29 188 24 151 C19 114 46 78 79 79 C107 80 123 102 113 125 C104 146 78 152 61 138 C48 128 48 109 61 99 C73 90 91 95 95 108 C99 120 90 132 79 131 C71 130 66 123 69 116 C71 111 77 109 82 112" fill="none" stro