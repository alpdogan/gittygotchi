effect-element="particle" d="M91 42 L98 49 L91 56 L84 49Z" fill="#7d53c7"/></g></g><g class="gitty-status-labels" data-gitty-status-labels="hunger mood sleep"><rect x="14" y="205" width="212" height="27" rx="10" fill="#f3ead7"/><text x="49" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Hunger</text><text x="49" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Normal</text><text x="120" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Mood</text><text x="120" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Happy</text><text x="191" y="216" text-anchor="middle" fill="#8a7a68" font-family="ui-rounded, system-ui, sans-serif" font-size="8" font-weight="700">Sleep</text><text x="191" y="228" text-anchor="middle" fill="#3d2f24" font-family="ui-rounded, system-ui, sans-serif" font-size="10" font-weight="700">Awake</text></g></svg>
