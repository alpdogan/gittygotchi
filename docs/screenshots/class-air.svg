<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-gitty-class="air" data-gitty-stage="adult" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>air adult looking happy.</desc><style> .gitty-idle { animation: gitty-bob 2.6s ease-in-out infinite; } .gitty-playing { animation: gitty-play 0.7s ease-in-out infinite; } .gitty-eating { animation: gitty-nibble 0.55s ease-in-out infinite; } .gitty-resting { animation: gitty-bob 4s ease-in-out infinite; } .gitty-sleepy { animation: gitty-bob 3.4s ease-in-out infinite; } .gitty-sleeping, .gitty-hibernating { animation: gitty-breathe 4.8s ease-in-out infinite; } .gitty-playing .gitty-tail { animation: gitty-wag 0.8s ease-in-out infinite; } .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: gitty-ear 2.8s ease-in-out infinite; } .gitty-bubble { animation: gitty-rise 3s ease-in-out infinite; } .gitty-flame { animation: gitty-flicker 0.9s ease-in-out infinite; } .gitty-spark { animation: gitty-flicker 1.2s ease-in-out infinite; } .gitty-psy { animation: gitty-float 2.8s ease-in-out infinite; } .gitty-zzz { animation: gitty-fade 2.2s ease-in-out infinite; } .gitty-orbit { animation: gitty-spin 6s linear infinite; } @keyframes gitty-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } } @keyframes gitty-play { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-6px) rotate(-5deg); } 70% { transform: translateY(-2px) rotate(5deg); } } @keyframes gitty-nibble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } } @keyframes gitty-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } } @keyframes gitty-wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } } @keyframes gitty-ear { 0%, 78%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-9deg); } } @keyframes gitty-rise { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 0.9; transform: translateY(-8px); } } @keyframes gitty-flicker { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } } @keyframes gitty-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes gitty-fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } } @keyframes gitty-spin { to { transform: rotate(360deg); } } @media (max-width: 96px) { .gitty-detail { display: none; } } @media (prefers-reduced-motion: reduce) { .gitty-idle, .gitty-playing, .gitty-eating, .gitty-resting, .gitty-sleepy, .gitty-sleeping, .gitty-hibernating, .gitty-bubble, .gitty-flame, .gitty-spark, .gitty-psy, .gitty-zzz, .gitty-orbit, .gitty-playing .gitty-tail, .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: none; } } </style><rect width="240" height="240" rx="28" fill="#f7f1e6" stroke="#cbbda3" stroke-width="3"/><g transform="translate(120 150) scale(1) translate(-120 -150)"><g class="gitty-idle"><g data-gitty-body="adult"><ellipse cx="120" cy="204" rx="56" ry="11" fill="#c5d8ea" opacity="0.45"/><g transform="translate(170 148)"><g class="gitty-tail"><path d="M0 0 q18 -8 28 -4 q12 8 8 22 q-8 10 -20 4" fill="none" stroke="#6ea8d4" stroke-width="12" stroke-linecap="round"/></g></g><g transform="translate(84 100) rotate(-30)"><g class="gitty-ear"><ellipse cx="0" cy="-24" rx="17" ry="30" fill="#eaf3fb" stroke="#2a4660" stroke-width="3.5"/><ellipse cx="0" cy="-22" rx="7" ry="14" fill="#c5e0f4"/></g></g><g transform="translate(156 100) rotate(30)"><g class="gitty-ear"><ellipse cx="0" cy="-24" rx="17" ry="30" fill="#eaf3fb" stroke="#2a4660" stroke-width="3.5"/><ellipse cx="0" cy="-22" rx="7" ry="14" fill="#c5e0f4"/></g></g><ellipse cx="120" cy="142" rx="56" ry="44" fill="#eaf3fb" stroke="#2a4660" stroke-width="4"/><ellipse cx="120" cy="156" rx="28" ry="16" fill="#c5e0f4" opacity="0.45"/><ellipse cx="96" cy="184" rx="14" ry="8" fill="#eaf3fb" stroke="#2a4660" stroke-width="3"/><ellipse cx="144" cy="184" rx="14" ry="8" fill="#eaf3fb" stroke="#2a4660" stroke-width="3"/></g><path class="gitty-spark" d="M176 76 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#6ea8d4" stroke="#2a4660" stroke-width="1.5"/><path class="gitty-detail" d="M52 128 q18 -10 28 4" fill="none" stroke="#6ea8d4" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/><path class="gitty-detail" d="M48 142 q20 -6 30 6" fill="none" stroke="#c5e0f4" stroke-width="2" stroke-linecap="round"/><path class="gitty-spark gitty-detail" d="M64 78 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#c5e0f4" stroke="#2a4660" stroke-width="1"/><path d="M94 138 q8 8 16 0" fill="none" stroke="#2a4660" stroke-width="3.5" stroke-linecap="round"/><path d="M130 138 q8 8 16 0" fill="none" stroke="#2a4660" stroke-width="3.5" stroke-linecap="round"/><path d="M110 158 q10 12 20 0" fill="none" stroke="#2a4660" stroke-width="3.5" stroke-linecap="round"/></g></g></svg>
