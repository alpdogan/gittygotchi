<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="water" data-prototype-stage="adult" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="adult" data-gitty-class="water" data-gitty-stage="adult" data-gitty-body="adult" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>water adult looking happy.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-water .gitty-tail { animation: water-tail-flow 3.3s ease-in-out infinite; } .water-bubble { animation: water-bubble-rise 4.8s ease-in infinite; transform-box: fill-box; transform-origin: center; } .bubble-2 { animation-duration: 5.7s; animation-delay: -2.3s; } .bubble-3 { animation-duration: 6.4s; animation-delay: -4.8s; } .bubble-4 { animation-duration: 4.2s; animation-delay: -1.4s; } .bubble-5 { animation-duration: 5.2s; animation-delay: -3.5s; } .bubble-6 { animation-duration: 5.9s; animation-delay: -4.1s; } .bubble-7 { animation-duration: 4.5s; animation-delay: -2.8s; } .water-drop { animation: water-drop-bob 3.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .drop-2 { animation-duration: 4.6s; animation-delay: -2.2s; } .drop-3 { animation-duration: 4.1s; animation-delay: -1.6s; } @keyframes water-bubble-rise { 0% { opacity: 0; transform: translate(0, 24px) scale(.7); } 18% { opacity: .85; } 80% { opacity: .65; } 100% { opacity: 0; transform: translate(8px, -42px) scale(1.06); } } @keyframes water-drop-bob { 0%, 100% { opacity: .45; transform: translateY(3px); } 50% { opacity: 1; transform: translateY(-5px); } } @keyframes water-tail-flow { 0%, 100% { transform: rotate(-1deg) scaleX(1); } 50% { transform: rotate(3deg) scaleX(1.025); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-water behavior-idle"><g data-effect-tier="adult"><g fill="none" stroke="#3697dc" stroke-width="2.5"><circle class="water-bubble bubble-1" data-effect-element="bubble" cx="44" cy="184" r="7"/><circle class="water-bubble bubble-2" data-effect-element="bubble" cx="62" cy="151" r="4"/><circle class="water-bubble bubble-3" data-effect-element="bubble" cx="193" cy="191" r="9"/><circle class="water-bubble bubble-4" data-effect-element="bubble" cx="205" cy="148" r="5"/><circle class="water-bubble bubble-5" data-effect-element="bubble" cx="181" cy="94" r="3.5"/></g></g><ellipse class="gitty-shadow" cx="128" cy="215" rx="52" ry="9" fill="#ad9e88" opacity=".34"/><g class="stage-adult" data-anatomy-stage="adult"><g class="gitty-character"><g class="gitty-tail"><path data-anatomy-part="tail" d="M94 178 C62 197 29 179 27 145 C25 112 48 82 76 82 C101 82 116 101 108 121 C102 138 84 148 69 140 C56 134 54 119 62 109 C68 102 79 101 86 107 C77 106 70 112 70 120 C70 128 80 132 88 126 C101 116 96 97 79 94 C59 91 42 112 43 137 C44 159 62 173 84 167 C88 166 92 170 94 178Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="stage-class-markings stage-class-markings-adult" opacity="0.9"><path d="M88 171 C63 184 40 169 36 147 C32 126 42 104 59 95" fill="none" stroke="#3697dc" stroke-width="8" stroke-linecap="round"/><path d="M88 166 C69 176 51 166 48 151 C45 138 51 124 63 118" fill="none" stroke="#8bd8e8" stroke-width="4" stroke-linecap="round"/></g></g><g class="gitty-body"><path data-anatomy-part="body" d="M118 130 C102 136 94 151 94 173 C94 195 106 207 124 209 C142 211 164 207 171 190 C179 171 168 142 151 132 C141 126 128 126 118 130Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 174 C116 187 132 192 145 185 C151 181 154 171 1