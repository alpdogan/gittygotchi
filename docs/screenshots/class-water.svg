y="2.8" fill="#fffdf8"/></g><path d="M118 129 C125 136 135 135 141 127" fill="none" stroke="#17283b" stroke-width="3" stroke-linecap="round"/><path d="M124 124 C127 126 130 126 133 123" fill="none" stroke="#17283b" stroke-width="2.4" stroke-linecap="round"/></g></g></g><g class="gitty-paws"><path data-anatomy-part="left-paw" d="M101 192 C94 195 94 205 103 208 C111 210 119 207 119 201 C118 195 108 190 101 192Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-anatomy-part="right-paw" d="M143 194 C137 198 139 207 148 209 C157 211 164 207 163 201 C161 195 150 191 143 194Z" fill="#f0f2e9" stroke="#17283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 202 L106 198 M111 204 L113 200 M148 203 L151 199 M156 204 L158 200" stroke="#17283b" stroke-width="1.8" stroke-linecap="round"/></g></g></g><g data-effect-tier="adult"><path class="water-drop drop-1" data-effect-element="drop" d="M46 82 C54 92 52 101 46 104 C39 101 38 92 46 82Z" fill="#8bd8e8" stroke="#3697dc" stroke-width="2"/><path class="water-drop drop-2" data-effect-element="drop" d="M207 103 C214 112 212 119 207 122 C201 119 201 111 207 103Z" fill="#8bd8e8" stroke="#3697dc" stroke-width="2"/></g></g></svg>
