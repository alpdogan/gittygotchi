<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-prototype-class="earth" data-prototype-stage="mature" data-prototype-mood="happy" data-prototype-hunger="normal" data-prototype-behavior="idle" data-prototype-expression="happy" data-class-effect-level="mature" data-gitty-class="earth" data-gitty-stage="mature" data-gitty-body="mature" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>earth mature looking happy.</desc><style> .gitty-character { animation: gitty-breathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } .gitty-tail { animation: tail-idle 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; } .gitty-eyes { animation: gitty-blink 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .stage-hatchling .gitty-ears, .stage-baby .gitty-ears { transform: scale(1.1); transform-box: fill-box; transform-origin: 50% 100%; } .stage-mature .gitty-tail { transform: scale(1.04); transform-box: fill-box; transform-origin: 85% 85%; } .behavior-sleeping .gitty-anatomy, .behavior-hibernating .gitty-anatomy { transform-origin: 50% 100%; } .food-bowl { animation: food-bowl-nudge 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .play-ball { animation: play-ball-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-zzz, .sleep-particle { animation: sleep-float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .sleep-particle-2 { animation-delay: -1.4s; animation-duration: 3.8s; } @keyframes gitty-breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.012); } } @keyframes gitty-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } } @keyframes tail-idle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } } @keyframes food-bowl-nudge { 0%, 70%, 100% { transform: translateX(0); } 82% { transform: translateX(-2px); } } @keyframes play-ball-bounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(9deg); } } @keyframes sleep-float { 0%, 100% { opacity: .35; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .gitty-character, .gitty-tail, .gitty-eyes, .earth-leaf, .water-bubble, .water-drop, .air-wind, .air-spark, .fire-flame, .fire-ember, .psy-particle, .psy-character, .psy-shadow, .food-bowl, .play-ball, .sleep-zzz, .sleep-particle { animation: none !important; } } .class-earth .gitty-tail { animation-duration: 5.8s; } .earth-leaf { animation: earth-leaf-drift 6.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .leaf-2 { animation-duration: 7.8s; animation-delay: -2.1s; opacity: .76; } .leaf-3 { animation-duration: 5.9s; animation-delay: -4.2s; opacity: .88; } .leaf-4 { animation-duration: 8.6s; animation-delay: -1.3s; opacity: .68; } .leaf-5 { animation-duration: 7.1s; animation-delay: -5.4s; opacity: .82; } .leaf-6 { animation-duration: 9.2s; animation-delay: -3.2s; opacity: .72; } .leaf-7 { animation-duration: 7.5s; animation-delay: -1.7s; } .leaf-8 { animation-duration: 6.7s; animation-delay: -4.8s; } .leaf-9 { animation-duration: 8.2s; animation-delay: -2.6s; } @keyframes earth-leaf-drift { 0%, 100% { transform: translate(0, -4px) rotate(-8deg); } 50% { transform: translate(8px, 10px) rotate(24deg); } } </style><rect x="2" y="2" width="236" height="236" rx="27" fill="#fbf7ee" stroke="#d8cdbb" stroke-width="3"/><g class="class-earth behavior-idle"><g data-effect-tier="adult"><g fill="#5f8f4a"><path class="earth-leaf leaf-1" data-effect-element="leaf" d="M38 78 C49 74 55 80 51 90 C42 91 36 86 38 78Z"/><path class="earth-leaf leaf-2" data-effect-element="leaf" d="M190 68 C201 64 207