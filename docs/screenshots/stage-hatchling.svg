<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" data-gitty-class="earth" data-gitty-stage="hatchling" data-gitty-behavior="idle" data-gitty-face="happy"><title>GittyGotchi for @alpdogan</title><desc>earth hatchling looking happy.</desc><style> .gitty-idle { animation: gitty-bob 2.6s ease-in-out infinite; } .gitty-playing { animation: gitty-play 0.7s ease-in-out infinite; } .gitty-eating { animation: gitty-nibble 0.55s ease-in-out infinite; } .gitty-resting { animation: gitty-bob 4s ease-in-out infinite; } .gitty-sleepy { animation: gitty-bob 3.4s ease-in-out infinite; } .gitty-sleeping, .gitty-hibernating { animation: gitty-breathe 4.8s ease-in-out infinite; } .gitty-playing .gitty-tail { animation: gitty-wag 0.8s ease-in-out infinite; } .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: gitty-ear 2.8s ease-in-out infinite; } .gitty-bubble { animation: gitty-rise 3s ease-in-out infinite; } .gitty-flame { animation: gitty-flicker 0.9s ease-in-out infinite; } .gitty-spark { animation: gitty-flicker 1.2s ease-in-out infinite; } .gitty-psy { animation: gitty-float 2.8s ease-in-out infinite; } .gitty-zzz { animation: gitty-fade 2.2s ease-in-out infinite; } .gitty-orbit { animation: gitty-spin 6s linear infinite; } @keyframes gitty-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } } @keyframes gitty-play { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-6px) rotate(-5deg); } 70% { transform: translateY(-2px) rotate(5deg); } } @keyframes gitty-nibble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } } @keyframes gitty-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } } @keyframes gitty-wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } } @keyframes gitty-ear { 0%, 78%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-9deg); } } @keyframes gitty-rise { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 0.9; transform: translateY(-8px); } } @keyframes gitty-flicker { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } } @keyframes gitty-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes gitty-fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } } @keyframes gitty-spin { to { transform: rotate(360deg); } } @media (max-width: 96px) { .gitty-detail { display: none; } } @media (prefers-reduced-motion: reduce) { .gitty-idle, .gitty-playing, .gitty-eating, .gitty-resting, .gitty-sleepy, .gitty-sleeping, .gitty-hibernating, .gitty-bubble, .gitty-flame, .gitty-spark, .gitty-psy, .gitty-zzz, .gitty-orbit, .gitty-playing .gitty-tail, .gitty-idle .gitty-ear, .gitty-playing .gitty-ear { animation: none; } } </style><rect width="240" height="240" rx="28" fill="#f7f1e6" stroke="#cbbda3" stroke-width="3"/><g transform="translate(120 150) scale(1) translate(-120 -150)"><g class="gitty-idle"><g data-gitty-body="hatchling"><ellipse cx="120" cy="202" rx="48" ry="9" fill="#d9c89a" opacity="0.45"/><g transform="translate(168 168)"><g class="gitty-tail"><path d="M0 0 q18 -8 22 -24" fill="none" stroke="#6f8f4e" stroke-width="9" stroke-linecap="round"/></g></g><path d="M68 168 C72 204 168 204 172 168 C148 186 92 186 68 168Z" fill="#efe3c4" stroke="#3d2c1e" stroke-width="4"/><path d="M68 168 L84 156 96 170 112 152 124 166 140 154 156 168 172 168" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="120" cy="118" rx="38" ry="36" fill="#efe3c4" stroke="#3d2c1e" stroke-width="4"/><g transform="translate(96 88) rotate(-22)"><g class="gitty-ear"><ellipse cx="0" cy="-12" rx="11" ry="18" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3.5"/><ellipse cx="0" cy="-10" rx="4.5" ry="8" fill="#c5d6a8"/></g></g><g transform="translate(144 88) rotate(22)"><g class="gitty-ear"><ellipse cx="0" cy="-12" rx="11" ry="18" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3.5"/><ellipse cx="0" cy="-10" rx="4.5" ry="8" fill="#c5d6a8"/></g></g><ellipse cx="120" cy="128" rx="18" ry="12" fill="#c5d6a8" opacity="0.45"/><ellipse cx="102" cy="176" rx="10" ry="7" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3"/><ellipse cx="138" cy="176" rx="10" ry="7" fill="#efe3c4" stroke="#3d2c1e" stroke-width="3"/></g><g class="gitty-earth" fill="#6f8f4e" stroke="#3d2c1e" stroke-width="2"><path d="M62 116 q8 -16 2 -26 q12 8 10 24z"/><path d="M168 114 q-4 -14 4 -24 q10 10 2 24z"/></g><path d="M98 118 q8 8 16 0" fill="none" stroke="#3d2c1e" stroke-width="3.5" stroke-linecap="round"/><path d="M126 118 q8 8 16 0" fill="none" stroke="#3d2c1e" stroke-width="3.5" stroke-linecap="round"/><path d="M110 138 q10 12 20 0" fill="none" stroke="#3d2c1e" stroke-width="3.5" stroke-linecap="round"/></g></g></svg>
